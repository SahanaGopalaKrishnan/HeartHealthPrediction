name: Heart Health Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_project:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python 3.12 (Matching your VS Code setup)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Install dependencies from your requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. "Build" the project by converting the notebook to HTML
    # This proves the notebook is valid and generates a viewable report
    - name: Build HTML Report
      run: |
        jupyter nbconvert --to html "Heart Health.ipynb"

    # 5. Save the Build Artifact (The HTML file)
    # This allows you to download the result from GitHub Actions
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: heart-health-report
        path: "Heart Health.html"
