name: Heart Health CI

on:
  push:
    branches: [ "main" ]

jobs:
  # This job handles both Build and Test
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install jupyter nbconvert ipykernel

    - name: Run Model Training (Test)
      run: |
        # This executes your notebook as a test
        jupyter nbconvert --to notebook --execute "Heart Health.ipynb" --output result.ipynb

    - name: Build Final Report (Build)
      run: |
        # This creates the final HTML shareable file
        jupyter nbconvert --to html "Heart Health.ipynb"
